# Asks each contributor to accept narado's Contributor Licence Agreement (CLA.md) once, by
# commenting on their pull request. Signatures are kept in signatures/cla.json on the
# `cla-signatures` branch of this repository. This workflow never checks out or runs the
# pull request's code, so pull_request_target is safe here.
name: CLA

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla:
    if: github.event_name == 'pull_request_target' || (github.event.issue.pull_request && (github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'))
    runs-on: ubuntu-latest
    steps:
      - uses: contributor-assistant/github-action@ca4a40a7d1004f18d9960b404b97e5f30a505a08 # v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-signatures: signatures/cla.json
          path-to-document: https://github.com/${{ github.repository }}/blob/main/CLA.md
          branch: cla-signatures
          allowlist: biprakanta,dependabot[bot],github-actions[bot]
          custom-notsigned-prcomment: >-
            Thank you for your pull request. narado is open source under the AGPL-3.0 and is also
            offered under a commercial licence, so before we can merge it we ask contributors to
            accept our [Contributor Licence Agreement](https://github.com/${{ github.repository }}/blob/main/CLA.md)
            once. You keep the copyright in your work. To accept, comment on this pull request
            with the sentence below.
          custom-allsigned-prcomment: All contributors have accepted the CLA. Thank you!
