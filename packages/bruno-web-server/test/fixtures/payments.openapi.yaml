# Payments API: used by narado's round-trip tests.
openapi: 3.1.0
info:
  title: Payments API
  version: 1.4.0
  description: |
    Create and look up payments.
    Refunds are a separate resource.
servers:
  - url: https://api.example.com/v1
    description: Production
  - url: https://sandbox.example.com/v1
    description: Sandbox
tags:
  - name: Payments
  - name: Refunds
    description: Money going back to the payer
paths:
  /payments:
    get:
      operationId: listPayments
      summary: List payments
      tags: [Payments]
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [pending, settled, failed]
        - $ref: '#/components/parameters/RequestId'
      responses:
        '200':
          description: A page of payments
    post:
      operationId: createPayment
      summary: Create a payment
      tags: [Payments]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/NewPayment'
            example:
              amount: 1250
              currency: INR
      responses:
        '201':
          description: Created
  /payments/{paymentId}:
    parameters:
      - name: paymentId
        in: path
        required: true
        schema:
          type: string
        example: pay_123
    get:
      operationId: getPayment
      summary: Get a payment
      description: Returns one payment by its ID.
      tags: [Payments]
      responses:
        '200':
          description: The payment
  /payments/{paymentId}/refunds:
    post:
      operationId: createRefund
      tags: [Refunds]
      parameters:
        - name: paymentId
          in: path
          required: true
          schema: { type: string }
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                amount: { type: integer }
      responses:
        '201':
          description: Refund created
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: OK
components:
  parameters:
    RequestId:
      name: X-Request-Id
      in: header
      schema:
        type: string
  schemas:
    NewPayment:
      type: object
      required: [amount, currency]
      properties:
        amount:
          type: integer
        currency:
          type: string
