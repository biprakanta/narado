# narado's tests, for every pull request and for pushes to main.
# (Bruno's own test workflows are switched off in this repository's Actions settings; its lint-checks
# workflow stays on and lints the lines each pull request changes.)
name: narado tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The tests don't start Electron; skip downloading its binary.
  ELECTRON_SKIP_BINARY_DOWNLOAD: '1'

jobs:
  server:
    name: Server, desktop and CLI tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Git identity for tests that commit
        run: |
          git config --global user.name "narado CI"
          git config --global user.email "ci@narado.invalid"
          git config --global init.defaultBranch main

      - name: Run server tests
        working-directory: packages/bruno-web-server
        run: npm test

      # NARADO_WORKER_USERS=1: as root in a container with only the capabilities ADMIN.md asks
      # for, each person's worker runs as a system user of its own.
      - name: Run the system-user tests as root, with only the capabilities they need
        run: |
          docker run --rm --cap-drop ALL \
            --cap-add SETUID --cap-add SETGID --cap-add CHOWN --cap-add FOWNER --cap-add DAC_OVERRIDE --cap-add KILL \
            --security-opt no-new-privileges \
            -v "$PWD":/repo:ro -w /repo/packages/bruno-web-server \
            node:24.22.3-bookworm-slim \
            node --test test/worker-users.test.js test/workers.test.js

  # The code narado desktop and the narado command run, on the systems they run on (Linux is
  # covered by the job above). The packaged app itself is checked on all three systems by
  # narado-desktop-release.yml.
  desktop-systems:
    name: Desktop and CLI tests (${{ matrix.name }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: macOS, os: macos-latest }
          - { name: Windows, os: windows-latest }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node dependencies
        uses: ./.github/actions/common/setup-node-deps
        with:
          shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}

      - name: Git identity for tests that commit
        shell: bash
        run: |
          git config --global user.name "narado CI"
          git config --global user.email "ci@narado.invalid"
          git config --global init.defaultBranch main

      - name: Run the desktop and CLI tests
        working-directory: packages/bruno-web-server
        shell: bash
        run: node --test --test-force-exit test/desktop.test.js test/desktop-d5.test.js test/desktop-guard.test.js test/devices.test.js test/cli.test.js test/mcp.test.js test/browse.test.js

  interface:
    name: Interface tests (narado screens and request tabs)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node dependencies
        uses: ./.github/actions/common/setup-node-deps

      - name: Run interface tests
        working-directory: packages/bruno-app
        run: npx jest src/components/Narado src/components/RequestTabs

  build:
    name: Interface build (narado brand)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node dependencies
        uses: ./.github/actions/common/setup-node-deps

      # Catches what the tests can't: imports and code that only fail when the interface is
      # built, as the desktop release and deploys do.
      - name: Build the interface
        run: npm run build:web
        env:
          BRUNO_BRAND: narado
